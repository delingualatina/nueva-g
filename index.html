<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Oficial</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d021a;
      background-image: radial-gradient(circle at 50% 20%, #2b084a 0%, #0d021a 70%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 15px;
    }

    /* Barra superior */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #25d366;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #25d366;
      border-radius: 50%;
      box-shadow: 0 0 8px #25d366;
    }

    .platform-badge {
      background: rgba(147, 51, 234, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #c084fc;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    /* Contenedor tipo Tarjeta */
    .card {
      background: rgba(22, 8, 38, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(147, 51, 234, 0.15);
      backdrop-filter: blur(10px);
    }

    .card-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .step-text {
      font-size: 12px;
      color: #a855f7;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    /* Barra de progreso */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-bottom: 22px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #3b82f6, #a855f7);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    /* Formularios y Preguntas */
    .question-block {
      margin-bottom: 18px;
    }

    .question-label {
      font-size: 14px;
      font-weight: 600;
      color: #f3e8ff;
      margin-bottom: 10px;
      display: block;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-label:hover {
      background: rgba(168, 85, 247, 0.1);
      border-color: rgba(168, 85, 247, 0.4);
    }

    .option-label input[type="radio"] {
      accent-color: #a855f7;
    }

    .input-text {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    .input-text:focus {
      border-color: #a855f7;
    }

    /* Botones de acción */
    .btn-next {
      width: 100%;
      background: linear-gradient(90deg, #2563eb, #9333ea);
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      padding: 14px;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      background-color: #25D366;
      border: none;
      color: #0d021a;
      font-weight: 800;
      font-size: 15px;
      padding: 14px;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 20px rgba(0, 230, 118, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Indicador de operador */
    .operator-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid rgba(37, 211, 102, 0.3);
      color: #25d366;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    /* Manejo de pantallas */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Insignias superiores -->
  <div class="status-badge">
    <div class="status-dot"></div>
    SISTEMA 24/7 OPERATIVO
  </div>
  <div class="platform-badge">
    💎 PLATAFORMA N° 1 DE ARGENTINA
  </div>

  <div class="card">
    <h2 class="card-title">Configuración de acceso</h2>
    
    <!-- PANTALLA 1 -->
    <div id="screen-1" class="screen active">
      <div class="step-text">
        <span>Paso 1 de 2</span>
        <span>50%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width: 50%;"></div>
      </div>

      <!-- Pregunta 1: Edad -->
      <div class="question-block">
        <label class="question-label">¿Confirmás que sos mayor de 18 años?</label>
        <label class="option-label">
          <input type="radio" name="edad" value="si" checked> Sí, soy mayor de edad
        </label>
        <label class="option-label">
          <input type="radio" name="edad" value="no"> No
        </label>
      </div>

      <!-- Pregunta 2: Nombre o Apodo -->
      <div class="question-block">
        <label class="question-label">Ingresá tu nombre o apodo</label>
        <input type="text" id="nombreInput" class="input-text" placeholder="Escribí acá tu nombre..." required>
      </div>

      <button type="button" class="btn-next" onclick="irAPantalla2()">Continuar →</button>
    </div>

    <!-- PANTALLA 2 -->
    <div id="screen-2" class="screen">
      <div class="step-text">
        <span>Paso 2 de 2</span>
        <span>100%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width: 100%;"></div>
      </div>

      <!-- Pregunta de filtro de pago / solvencia -->
      <div class="question-block">
        <label class="question-label">¿Qué medio utilizás para transferencias?</label>
        
        <label class="option-label">
          <input type="radio" name="medioPago" value="Mercado Pago / Billeteras virtuales" checked>
          Mercado Pago / Billeteras virtuales
        </label>

        <label class="option-label">
          <input type="radio" name="medioPago" value="Transferencia bancaria (CBU/CVU)">
          Transferencia bancaria (CBU/CVU)
        </label>

        <!-- Descarte automático inmediato al tocar esta opción -->
        <label class="option-label" style="opacity: 0.7;" onclick="descartarUsuario()">
          <input type="radio" name="medioPago" value="sin_saldo" onchange="descartarUsuario()">
          No dispongo de saldo para transferir
        </label>
      </div>

      <div class="operator-chip">
        <span class="status-dot"></span>
        Asignando operador disponible...
      </div>

      <button type="button" class="btn-submit" onclick="finalizarYEnviar()">
        Generar acceso y chatear con asesor 📲
      </button>

      <p style="text-align: center; margin-top: 15px;">
        <a href="javascript:void(0)" onclick="volverAPaso1()" style="color: rgba(255,255,255,0.4); font-size: 12px; text-decoration: none;">← Volver al paso anterior</a>
      </p>
    </div>

  </div>

  <script>
    // REEMPLAZÁ CON TU WHATSAPP (Solo números: sin "+", guiones ni espacios)
    const NUMERO_WHATSAPP = "5491178968766"; 

    function irAPantalla2() {
      const mayorEdad = document.querySelector('input[name="edad"]:checked').value;
      const nombre = document.getElementById('nombreInput').value.trim();

      if (mayorEdad === "no") {
        alert("El acceso está disponible únicamente para mayores de 18 años.");
        return;
      }

      if (!nombre) {
        alert("Por favor ingresá tu nombre o apodo para continuar.");
        return;
      }

      document.getElementById('screen-1').classList.remove('active');
      document.getElementById('screen-2').classList.add('active');
    }

    // EXPULSA APENAS SE TOCA "NO DISPONGO DE SALDO" (SIN TOCAR EL BOTÓN NI DISPARAR LEAD)
    function descartarUsuario() {
      alert("El acceso y la asignación de asesor están reservados exclusivamente para usuarios con saldo operativo disponible.");
      window.location.href = "https://www.google.com";
    }

    function finalizarYEnviar() {
      const nombre = document.getElementById('nombreInput').value.trim() || "Usuario";
      const medio = document.querySelector('input[name="medioPago"]:checked').value;

      if (medio === "sin_saldo") {
        descartarUsuario();
        return;
      }

      // 1. DISPARO DEL PÍXEL (Solo si tiene saldo y va a WhatsApp)
      if (typeof fbq === 'function') {
        fbq('track', 'Lead');
      }

      // 2. REDIRECCIÓN A WHATSAPP
      const mensaje = `Hola, completé el acceso en la web. Mi nombre es ${nombre}, soy mayor de 18 y opero con ${medio}. Quiero habilitar mi usuario.`;
      const urlWhatsapp = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;

      window.location.href = urlWhatsapp;
    }

    function volverAPaso1() {
      document.getElementById('screen-2').classList.remove('active');
      document.getElementById('screen-1').classList.add('active');
    }
  </script>
</body>
</html>
